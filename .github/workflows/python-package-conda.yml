name: Python Application CI

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-qt
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test imports and basic window initialization
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -c "import main, Jarvis_UI, gemini_api, config, gui_components, ai_core_visualization, utils; print('Imports successful!')"
        python -c "from PySide6.QtWidgets import QApplication; import sys, Jarvis_UI; app = QApplication(sys.argv); w = Jarvis_UI.JarvisMainWindow(); assert w.windowTitle() == 'JARVIS AI Assistant'"
